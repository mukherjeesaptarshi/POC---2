name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================
  # API TESTS
  # =========================
  api:
    name: API tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test

      - name: Upload API reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            reports/api-cucumber-report.html
          retention-days: 30

  # =========================
  # WEB SMOKE TESTS
  # =========================
  web-smoke:
    name: Web smoke tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web smoke pack
        run: npm run test:web:smoke
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://parabank.parasoft.com/parabank' }}

      - name: Run web BDD smoke pack
        run: npm run test:web:bdd
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://parabank.parasoft.com/parabank' }}

      - name: Upload web report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report
          path: |
            playwright-report/
            test-results/
            reports/web-cucumber-report.html
            reports/web-cucumber-report.json
          retention-days: 30

  # =========================
  # SECRET SCAN
  # =========================
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================
  # DEPLOY
  # =========================
  deploy:
    name: Deploy
    needs:
      - api
      - secret-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "All CI checks passed."
          echo "Starting deployment..."
          # Add actual deployment commands here

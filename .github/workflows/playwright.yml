name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================
  # API TESTS
  # =========================
  api:
    name: API tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      REPORT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test

      - name: Upload API reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            reports/api-cucumber-report.html
          retention-days: 30

      - name: Upload API report input
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-api
          path: reports/api-cucumber-*.json
          retention-days: 10

  # =========================
  # WEB SMOKE TESTS
  # =========================
  web-smoke:
    name: Web smoke tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      REPORT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web smoke pack
        run: npm run test:web:smoke
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://parabank.parasoft.com/parabank' }}

      - name: Run web BDD smoke pack
        run: npm run test:web:bdd
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://parabank.parasoft.com/parabank' }}

      - name: Upload web report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report
          path: |
            playwright-report/
            test-results/
            reports/web-cucumber-report.html
            reports/web-cucumber-report.json
          retention-days: 30

      - name: Upload web report inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-web
          path: |
            reports/web-cucumber-*.json
            reports/playwright-*.json
          retention-days: 10

  consolidated-report:
    name: Consolidated ten-day report
    if: ${{ always() }}
    needs:
      - api
      - web-smoke
    runs-on: ubuntu-latest
    env:
      REPORT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download suite reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: suite-results-*
          path: reports/incoming
          merge-multiple: true

      - name: Restore ten-day report history
        uses: actions/cache/restore@v4
        with:
          path: reports/consolidated-history.json
          key: suite-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-history-${{ github.ref_name }}-

      - name: Build consolidated HTML report
        run: npm run report:consolidate

      - name: Save ten-day report history
        uses: actions/cache/save@v4
        with:
          path: reports/consolidated-history.json
          key: suite-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload consolidated report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-ten-day-report
          path: |
            reports/consolidated-report.html
            reports/consolidated-history.json
          retention-days: 10

  # =========================
  # SECRET SCAN
  # =========================
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================
  # DEPLOY
  # =========================
  deploy:
    name: Deploy
    needs:
      - api
      - secret-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "All CI checks passed."
          echo "Starting deployment..."
          # Add actual deployment commands here
